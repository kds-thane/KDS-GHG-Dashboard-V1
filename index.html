<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KDS | GHG Activity Data Portal</title>
<style>
:root{--g:#ADC155;--gd:#6E8528;--gr:#5C676B;--gl:#F1F4E6;--bg:#F5F6F6;--ln:#DDE1E2;--ok:#4C9A3F;--wa:#E0A800;--er:#D64545;--bl:#2F7DC1}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 "Segoe UI",Arial,sans-serif;background:var(--bg);color:#2b3336}
header{background:#fff;border-bottom:4px solid var(--g);display:flex;align-items:center;gap:16px;padding:8px 20px;flex-wrap:wrap}
header img{height:46px}header h1{font-size:17px;margin:0;color:var(--gr)}header small{color:#7a868a}.sp{flex:1}
main{padding:16px 20px;max-width:1280px;margin:auto}
.card{background:#fff;border:1px solid var(--ln);border-radius:8px;padding:14px;margin-bottom:14px;overflow-x:auto}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
label{font-size:11px;color:#7a868a;display:block;text-transform:uppercase;letter-spacing:.4px}
select,input{padding:7px 8px;border:1px solid #c9d0d2;border-radius:5px;font:inherit;background:#fff;width:100%}
button{background:var(--gd);color:#fff;border:0;border-radius:5px;padding:8px 14px;font:inherit;cursor:pointer}button.s{background:#fff;color:var(--gr);border:1px solid #c9d0d2}button.r{background:var(--er)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}.k{background:#fff;border:1px solid var(--ln);border-top:3px solid var(--g);border-radius:8px;padding:12px}.k b{font-size:24px;color:var(--gr);display:block}.k span{font-size:12px;color:#7a868a}
table{width:100%;border-collapse:collapse}th{background:var(--gr);color:#fff;text-align:left;padding:8px;font-size:12px}td{padding:7px 8px;border-bottom:1px solid #eceff0;vertical-align:middle}
.chip{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;color:#fff;cursor:pointer;white-space:nowrap}
.NS{background:#9aa5a8}.IP{background:var(--bl)}.SU{background:#1f5f99}.RT{background:var(--wa);color:#222}.AP{background:var(--ok)}.MS{background:var(--er)}
.pb{height:8px;background:#e6eaeb;border-radius:4px;overflow:hidden;min-width:90px}.pb i{display:block;height:100%;background:var(--g)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--ln);margin-bottom:12px;flex-wrap:wrap}.tabs a{padding:8px 16px;cursor:pointer;color:var(--gr);border-bottom:3px solid transparent;margin-bottom:-2px}.tabs a.on{border-color:var(--g);font-weight:600;color:var(--gd)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;background:var(--gl);padding:12px;border-radius:6px;margin-bottom:12px;align-items:end}
.fl{color:var(--er);font-size:12px}.note{background:#FFF7DD;border-left:4px solid var(--wa);padding:8px 12px;margin-bottom:10px;border-radius:4px}
.prof{display:flex;gap:22px;flex-wrap:wrap}.prof div{font-size:13px}.prof b{display:block;font-size:11px;color:#7a868a;text-transform:uppercase}
#login{max-width:360px;margin:8vh auto;text-align:center}#login input{margin:6px 0}#login img{width:230px;margin-bottom:10px}#err{color:var(--er);min-height:20px}
.hid{display:none}
</style></head><body>

const $=id=>document.getElementById(id),d0=new Date(),closed=Math.max(0,Math.min(12,(d0.getFullYear()-2026)*12+d0.getMonth()-3));

async function post(action,d){const r=await fetch(API,{method:'POST',body:JSON.stringify({action,...U,...d})});return r.json()}
async function login(){const u=$('u').value.trim(),p=$('p').value;
 if(API){try{const r=await post('getData',{user:u,pass:p});if(!r.ok)throw r.error;U={user:u,pass:p,role:r.role,name:r.name};FA=r.facilities;E=r.entries;ST=r.status}catch(x){$('err').textContent=x||'Login failed';return}}
 else{const c={kdsadmin:['Admin@123','Admin','KDS Admin'],client:['Client@123','Client','Client User']}[u.toLowerCase()];if(!c||c[0]!==p){$('err').textContent='Invalid credentials';return}U={user:u,role:c[1],name:c[2]};demo()}
 if(!FA.length){$('err').textContent='No facilities assigned to this user';return}
 F=FA[0].id;P=PER[Math.max(0,closed-1)];$('login').classList.add('hid');$('app').classList.remove('hid');$('cl').textContent=CLIENT+' · '+FYL;$('who').textContent=U.name+' ('+U.role+')';draw()}
function demo(){
 FA=[{id:'F01',name:'Chakan Machining Plant',loc:'Chakan MIDC',dist:'Pune',type:'Auto components – machining',emp:420,area:38000,contact:'Rahul Patil'},{id:'F02',name:'Shiroli Foundry',loc:'Shiroli MIDC',dist:'Kolhapur',type:'Ferrous casting foundry',emp:310,area:26500,contact:'Sneha Kulkarni'},{id:'F03',name:'Ambad Assembly Unit',loc:'Ambad MIDC',dist:'Nashik',type:'Assembly & painting',emp:260,area:21000,contact:'Amit Deshmukh'}];
 const B={F01:{a:2200,b:600,e:1500,g:4,h:310000,j:420,l:95000,n:6,p:22000},F02:{c:65,d:18000,a:3000,h:680000,j:900,m:14,l:140000,e:900},F03:{b:1400,a:900,f:700,h:190000,i:40000,k:60,o:24000,l:30000,p:15000}};
 let s=7;const rnd=()=>(s=s*16807%2147483647)/2147483647;
 FA.forEach(f=>{for(let i=0;i<6;i++)Object.entries(B[f.id]).forEach(([k,b])=>{const r=SRC.find(x=>x[0]==k),p=PER[i];
  if(k=='g'&&i%3!=1)return;if(f.id=='F03'&&r[1]=='Scope 3'&&i>=4)return;if(f.id=='F02'&&r[1]=='Scope 1'&&i==5&&k!='a')return;
  const q=Math.round(b*(.9+.2*rnd())*(f.id=='F02'&&k=='h'&&i==4?2.1:1));
  E.push({id:'E'+E.length,fid:f.id,period:p,scope:r[1],cat:r[2],src:r[3],qty:q,unit:r[4][0],ds:r[5],dq:rnd()<.6?'Measured':rnd()<.5?'Calculated':'Estimated',evName:rnd()<.75?`${f.id}_${k}_${p}.pdf`:'',evUrl:'',rem:'',by:'client',upd:'2026-10-0'+(i+1)})})});
 FA.forEach(f=>SCOPES.forEach(sc=>{for(let i=0;i<5;i++)if(E.some(e=>e.fid==f.id&&e.period==PER[i]&&e.scope==sc))ST[f.id+'|'+PER[i]+'|'+sc]={status:i<4?'Approved':'Submitted'}}));

function sstat(f,p,sc){const k=f+'|'+p+'|'+sc;if(ST[k])return ST[k].status;if(E.some(e=>e.fid==f&&e.period==p&&e.scope==sc))return'In progress';return PER.indexOf(p)<closed?'Missing':'Not started'}

function go(f,p,sc){F=f;P=p;TAB=sc;EDIT=null;draw();scrollTo(0,document.body.scrollHeight)}

function flag(e){const o=E.filter(x=>x.fid==e.fid&&x.src==e.src&&x.unit==e.unit&&x.id!=e.id),f=[];if(o.length>=3){const a=o.reduce((s,x)=>s+x.qty,0)/o.length;if(e.qty>2*a||e.qty<.4*a)f.push('Deviates from average')}if(!e.evName)f.push('No evidence');return f.join(' · ')}
const opt=(a,v)=>a.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('');

 <div><label>Reporting period</label><select onchange="P=this.value;EDIT=null;draw()">${opt(PER,P)}</select></div></div>

function srcCh(){const r=SRC.find(x=>x[3]==$('fs').value);$('fu').innerHTML=opt(r[4]);$('fd').value=r[5]}
function panel(){
 if(TAB=='Evidence')return `<table><tr><th>Period</th><th>Scope</th><th>Source</th><th>File</th></tr>${E.filter(e=>e.fid==F&&e.evName).sort((a,b)=>PER.indexOf(a.period)-PER.indexOf(b.period)).map(e=>`<tr><td>${e.period}</td><td>${e.scope}</td><td>${e.src}</td><td>${e.evUrl&&U.role=='Admin'?`<a href="${e.evUrl}" target="_blank">${e.evName}</a>`:e.evName}</td></tr>`).join('')||'<tr><td colspan=4>No evidence uploaded</td></tr>'}</table>`;
 const st=sstat(F,P,TAB),rows=E.filter(e=>e.fid==F&&e.period==P&&e.scope==TAB),A=U.role=='Admin',lock=!A&&['Submitted','Approved'].includes(st),cm=(ST[F+'|'+P+'|'+TAB]||{}).comment;
 return `<p>${chip(st,F,P,TAB)} <b>${TAB} · ${P}</b> ${lock?'<small>– locked (submitted)</small>':''}</p>${st=='Returned'&&cm?`<div class="note"><b>KDS comment:</b> ${cm}</div>`:''}
 ${lock?'':`<div class="grid"><div><label>Category – Source</label><select id="fs" onchange="srcCh()">${SRC.filter(x=>x[1]==TAB).map(x=>`<option value="${x[3]}">${x[2]} – ${x[3]}</option>`).join('')}</select></div><div><label>Quantity</label><input id="fq" type="number" min="0" step="any"></div><div><label>Unit</label><select id="fu"></select></div><div><label>Data source</label><select id="fd">${opt(DSL)}</select></div><div><label>Data quality</label><select id="fdq">${opt(DQ)}</select></div><div><label>Evidence (max 8 MB)</label><input id="ff" type="file"></div><div><label>Remarks</label><input id="fr"></div><div><button onclick="save()">${EDIT?'Update':'Add'} entry</button></div></div>`}
 <table><tr><th>Category</th><th>Source</th><th>Quantity</th><th>Unit</th><th>Data source</th><th>Quality</th><th>Evidence</th><th>Remarks</th><th>Flags</th><th></th></tr>
 ${rows.map(e=>`<tr><td>${e.cat}</td><td>${e.src}</td><td><b>${e.qty.toLocaleString('en-IN')}</b></td><td>${e.unit}</td><td>${e.ds}</td><td>${e.dq}</td><td>${e.evUrl&&A?`<a href="${e.evUrl}" target="_blank">${e.evName}</a>`:e.evName||'–'}</td><td>${e.rem||''}</td><td class="fl">${flag(e)}</td><td>${lock?'':`<button class="s" onclick="EDIT='${e.id}';draw()">Edit</button> <button class="s" onclick="del('${e.id}')">✕</button>`}</td></tr>`).join('')||'<tr><td colspan=10>No entries yet for this section.</td></tr>'}</table>
 <p>${!lock&&rows.length&&st!='Approved'?`<button onclick="setSec('Submitted')">Submit ${TAB} for review</button>`:''} ${A&&st=='Submitted'?`<button onclick="setSec('Approved')">Approve</button> <button class="r" onclick="setSec('Returned')">Return with comment</button>`:''}</p>`}
async function save(){const q=parseFloat($('fq').value);if(!(q>=0)){alert('Enter a valid quantity');return}
 const r=SRC.find(x=>x[3]==$('fs').value),old=E.find(e=>e.id==EDIT),fl=$('ff').files[0];if(fl&&fl.size>8e6){alert('File must be under 8 MB');return}
 const e={...(old||{id:'E'+Date.now(),fid:F,period:P,scope:TAB,evName:'',evUrl:''}),cat:r[2],src:r[3],qty:q,unit:$('fu').value,ds:$('fd').value,dq:$('fdq').value,rem:$('fr').value,by:U.user,upd:new Date().toISOString().slice(0,10)};
 if(fl)e.evName=fl.name;old?Object.assign(old,e):E.push(e);EDIT=null;
 if(API){try{const a=await post('saveEntry',{entry:e});if(!a.ok)throw a.error;if(fl){const b=await new Promise(rs=>{const rd=new FileReader();rd.onload=()=>rs(rd.result.split(',')[1]);rd.readAsDataURL(fl)});const u=await post('uploadEvidence',{id:e.id,name:fl.name,mime:fl.type,data:b});if(!u.ok)throw u.error;e.evUrl=u.url}}catch(x){alert('Save failed: '+x)}}
 draw()}
function del(id){if(!confirm('Delete this entry?'))return;E=E.filter(e=>e.id!=id);if(API)post('deleteEntry',{id}).then(r=>r.ok||alert(r.error));draw()}
function setSec(s){let c='';if(s=='Returned'){c=prompt('Comment for the client:')||'';if(!c)return}
 ST[F+'|'+P+'|'+TAB]={status:s,comment:c};if(API)post('setSection',{fid:F,period:P,scope:TAB,status:s,comment:c}).then(r=>r.ok||alert(r.error));draw()}
</script></body></html>
